version: 2
updates:
  # Akcje w workflowach są przypięte do SHA z komentarzem "# vX.Y.Z".
  # Dependabot podbija SHA i aktualizuje komentarz z wersją.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: ci
